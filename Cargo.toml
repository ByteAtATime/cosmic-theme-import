[package]
name = "cosmic-theme-import"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
cosmic-theme = { git = "https://github.com/pop-os/libcosmic", default-features = false }
cosmic-config = { git = "https://github.com/pop-os/libcosmic" }
ron = "0.12.2"

[profile.release]
opt-level = "z"
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
